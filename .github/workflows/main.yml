name: Update Data

on:
  # 定时任务已禁用（JSON 数据已剔除，改用运行时目录反查）
  # schedule:
  #   - cron: '0 16 * * *'

  # 允许从 Actions 页手动触发
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Get Data
        run: node src/crawler/getData.js

      - name: Update Data
        uses: EndBug/add-and-commit@v9
        with:
          add: 'src/data/*.json'
          default_author: github_actions
          message: 'update data'
          fail-if-no-files: false
