name: Build

on:
  push:
    branches:
      - main

# 防止重叠 push 并发触发，导致重复打 Release / 抢提交
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 取 commit message，判断是否 build: 发版提交
      - name: Get commit message
        run: |
          COMMIT_MESSAGE=$(git log --format=%s -n 1)
          echo "commitmsg=${COMMIT_MESSAGE}" >> "$GITHUB_ENV"
      - name: Show commit message
        run: echo "$commitmsg"

      # 仅 build: 开头才提取版本号并后续构建/发版；其余 push 直接跳过，省时
      - name: Get dist tag
        if: startsWith( env.commitmsg , 'build:' )
        run: |
          DIST_TAG=$(echo "$commitmsg" | grep -Po '(\d(\.\d)+)')
          echo "disttag=v${DIST_TAG}" >> "$GITHUB_ENV"
          echo "$disttag"

      # —— 以下仅发版提交执行 ——
      - name: Setup pnpm
        if: env.disttag
        uses: pnpm/action-setup@v4
        with:
          version: 8

      - name: Setup Node.js
        if: env.disttag
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        if: env.disttag
        run: pnpm install

      - name: Build
        if: env.disttag
        run: pnpm run build

      - name: Commit dist
        uses: EndBug/add-and-commit@v9
        if: env.disttag
        with:
          add: 'dist/index.user.js --force'
          default_author: github_actions
          message: 'commit ${{ env.disttag }} release asset'
          branch: main

      - name: Release
        uses: softprops/action-gh-release@v2
        if: env.disttag
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.disttag }}
          prerelease: false
          files: |
            dist/index.user.js
